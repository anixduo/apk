name: Build Frost Mart APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-0 gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good libgstreamer-plugins-base1.0-dev \
          libgstreamer1.0-dev libgtk-3-dev unzip zip curl \
          autoconf libtool pkg-config autoconf-archive libunwind-dev
        pip install buildozer cython

    - name: Accept Android SDK licenses
      run: |
        yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

    - name: Build APK
      run: |
        echo "android.ndk = 26c" >> buildozer.spec
        sed -i 's/curl_cffi,//g' buildozer.spec
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FrostMart-APK
        path: bin/*.apk

    - name: Upload build log (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: .buildozer/logs/build.log
